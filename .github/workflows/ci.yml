name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_FROZEN: "1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups

      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

      - name: Check for missing migrations
        run: uv run python -m tests.manage makemigrations --check --dry-run

  test:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Spelled out rather than a product: each Django release supports a
        # different span of interpreters.
        include:
          - python-version: "3.10"
            django: "5.2"
            django_spec: "django>=5.2,<6.0"
          - python-version: "3.11"
            django: "5.2"
            django_spec: "django>=5.2,<6.0"
          - python-version: "3.12"
            django: "5.2"
            django_spec: "django>=5.2,<6.0"
          - python-version: "3.12"
            django: "6.0"
            django_spec: "django>=6.0,<6.1"
          - python-version: "3.13"
            django: "5.2"
            django_spec: "django>=5.2,<6.0"
          - python-version: "3.13"
            django: "6.0"
            django_spec: "django>=6.0,<6.1"
          - python-version: "3.14"
            django: "6.0"
            django_spec: "django>=6.0,<6.1"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-groups

      - name: Pin Django ${{ matrix.django }}
        run: uv pip install "${{ matrix.django_spec }}"

      - name: Show the resolved versions
        run: uv run --no-sync python -c "import django, sys; print(sys.version); print(django.get_version())"

      - name: Run the test suite
        run: >-
          uv run --no-sync pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Run the swapped-scope-model suite
        run: uv run --no-sync pytest tests/scoped --ds=tests.settings_scoped -q

      - name: Upload coverage
        if: matrix.python-version == '3.14' && matrix.django == '6.0'
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  postgres:
    name: PostgreSQL ${{ matrix.postgres }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest server the oldest supported Django takes, and the newest of
        # both. Resolution is SQL, and the two backends do not agree about all of
        # it, so it is run against a real PostgreSQL rather than only SQLite.
        include:
          - postgres: "14"
            python-version: "3.13"
            django: "5.2"
            django_spec: "django>=5.2,<6.0"
          - postgres: "17"
            python-version: "3.14"
            django: "6.0"
            django_spec: "django>=6.0,<6.1"

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cascading_settings
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cascading_settings

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-groups

      - name: Pin Django ${{ matrix.django }}
        run: uv pip install "${{ matrix.django_spec }}"

      - name: Show the resolved versions
        run: >-
          uv run --no-sync python -c "import django, sys; print(sys.version);
          print(django.get_version())"

      - name: Run the test suite
        run: uv run --no-sync pytest -q

      - name: Run the swapped-scope-model suite
        run: uv run --no-sync pytest tests/scoped --ds=tests.settings_scoped -q

  # Django's main branch breaks for reasons that are not this project's fault, so it
  # reports without gating the merge.
  django-main:
    name: Django main (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install the project
        run: uv sync --all-groups

      - name: Install Django from main
        run: uv pip install "https://github.com/django/django/archive/main.tar.gz"

      - name: Run the test suite
        run: uv run --no-sync pytest -q

  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv build

      - name: Check the metadata renders on PyPI
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --all-groups

      - name: Run every hook
        run: uv run pre-commit run --all-files --show-diff-on-failure
