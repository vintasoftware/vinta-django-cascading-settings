name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    # A dispatch runs from a branch, whose name is not a version; a release
    # has to be a `vX.Y.Z` tag.
    if: github.event_name != 'release' || startsWith(github.ref_name, 'v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check that the tag matches the project version
        if: github.event_name == 'release'
        run: |
          version="$(uv version --short --color never)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $tag does not match the version $version in pyproject.toml"
            exit 1
          fi

      - name: Build the sdist and wheel
        run: uv build

      - name: Check the metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test-pypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vinta-django-cascading-settings
    permissions:
      # Trusted publishing: PyPI mints a short lived token from this, so the repository
      # never stores an API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vinta-django-cascading-settings
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  sign:
    name: Attach signed artifacts to the release
    needs: pypi
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      # Not older than this: Sigstore rotated its TUF root, and a version that
      # bundles the trust root from before it fails with
      # `UnsignedMetadataError: root was signed by 0/3 keys` -- after the
      # upload has already happened, so the package is out and the signatures
      # are not.
      #
      # It attaches the artifacts and their bundles to the release on its own,
      # which is why there is no upload step here: adding one puts the same
      # filenames up twice and the second attempt is what fails.
      - name: Sign with Sigstore and attach to the release
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          release-signing-artifacts: true
