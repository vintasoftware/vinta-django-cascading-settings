# The matrix is spelled out as explicit factor pairs rather than a full product,
# because each Django release supports a different span of interpreters.
#
# Add a "-pg" factor to run an environment against PostgreSQL instead of SQLite:
# `tox -e py313-dj52-pg`, with a server reachable through the usual PG* variables.
# Those environments are deliberately out of the default list, so a checkout with
# no PostgreSQL to hand still runs green.
[tox]
requires =
    tox>=4.24
    tox-uv>=1.25
env_list =
    py310-dj52
    py311-dj52
    py312-dj52
    py312-dj60
    py313-dj52
    py313-dj60
    py314-dj60
    py314-djmain
    lint
    types
skip_missing_interpreters = true

[testenv]
runner = uv-venv-lock-runner
description = Run the test suite on this interpreter against the pinned Django
package = wheel
wheel_build_env = .pkg
dependency_groups = dev
# Pinning Django belongs in commands_pre rather than in deps: the lock runner
# syncs from uv.lock and ignores deps, so a factor spelled there installs
# nothing and every environment quietly tests whatever the lock pins.
allowlist_externals = uv
commands_pre =
    dj52: uv pip install "django>=5.2,<6.0"
    dj60: uv pip install "django>=6.0,<6.1"
    djmain: uv pip install "https://github.com/django/django/archive/main.tar.gz"
    python -c "import django; print('Django', django.get_version())"
# Django's main branch breaks for reasons that are not this project's fault, so those
# environments report without failing the run.
ignore_outcome =
    djmain: true
set_env =
    PYTHONDEVMODE = 1
    pg: TEST_DATABASE = postgres
pass_env =
    PG*
commands =
    pytest {posargs:--cov --cov-report=term-missing}
    # The swapped-scope-model run: `Meta.swappable` resolves once per process,
    # so a scope model the package does not own needs its own invocation.
    pytest tests/scoped --ds=tests.settings_scoped {posargs:--cov --cov-append}

[testenv:lint]
runner = uv-venv-lock-runner
description = Check formatting and lint rules
dependency_groups = dev
skip_install = true
commands =
    ruff check .
    ruff format --check .

[testenv:types]
runner = uv-venv-lock-runner
description = Type check with mypy and django-stubs
dependency_groups = dev
commands =
    mypy

[testenv:build]
runner = uv-venv-lock-runner
description = Build the sdist and wheel and check the metadata
skip_install = true
deps =
    build
    twine
commands =
    python -m build
    twine check dist/*
